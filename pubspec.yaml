name: kugelaudio
description: >-
  Official KugelAudio SDK for Dart and Flutter: low-latency text to speech
  (REST and WebSocket streaming), voices, dictionaries and speech enhancement.
version: 0.1.1
homepage: https://kugelaudio.com
repository: https://github.com/Kugelaudio/dart-sdk
issue_tracker: https://github.com/Kugelaudio/dart-sdk/issues
documentation: https://docs.kugelaudio.com
topics:
  - tts
  - text-to-speech
  - speech
  - audio
  - voice

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  crypto: ^3.0.7
  http: ^1.6.0
  logging: ^1.3.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
